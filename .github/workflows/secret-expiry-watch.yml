name: Secret Expiry Watch

# Read-only auth/credential-degradation monitor (ADR-0003 secret-expiry-watch, a
# P0 monitor). The whole machine hangs on three secrets; an expired
# CLAUDE_CODE_OAUTH_TOKEN once silently 401'd every tick. This probes them ONCE
# per day, AHEAD of the 05:30 growth window, so a dead credential is flagged
# before the day's runs burn on it. SINGLE-attempt probes (no retry loop — a retry
# could hammer the very endpoint that 401'd). Files/auto-closes ONE sticky issue.
#
# Kill switch (2026-11-13): scheduled runs stop when the
# SECRET_EXPIRY_WATCH_ENABLED repository variable is "false" (a manual dispatch
# always runs). Unset means ON: this probe already ran every day, so the switch
# changes nothing until someone sets it. The in-tree _data/fleet_pause.yml
# stays the emergency stop.
#
# Fleet harness standard (2026-11-13; bamr87/bamr87 _data/fleet.yml
# `harnesses.standard`): the Claude probe takes its credential in the order of
# this repo's CLAUDE_AUTH_ORDER variable. Unset means oauth, then api_key, so it
# still probes CLAUDE_CODE_OAUTH_TOKEN whenever that secret is set; when the
# order selects the API key, the key is what the lanes will use and so the key
# is what gets probed, and the report names it. The probe also carries a dollar
# cap (--max-budget-usd) and the job a timeout.

on:
  schedule:
    - cron: "40 13 * * *"  # staggered AI cron (bamr87/bamr87#348); was 5 5 * * *
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write # claude-code-action OIDC for the OAuth probe

concurrency:
  group: secret-expiry-watch
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # The scheduled probe runs unless a human turns it off:
    #   gh variable set SECRET_EXPIRY_WATCH_ENABLED --body false
    # A manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.SECRET_EXPIRY_WATCH_ENABLED != 'false'
    # Wall-clock bound: none of the last 60 runs took a full minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Kill-switch
        id: pause
        run: |
          if ruby -ryaml -e 'exit(YAML.load_file("_data/fleet_pause.yml")["paused"] == true ? 0 : 1)' 2>/dev/null; then
            echo "::notice::Fleet paused — skipping secret-expiry-watch."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe LIFECYCLE_PAT (single attempt, read-only)
        id: pat
        if: steps.pause.outputs.skip != 'true'
        env:
          PAT: ${{ secrets.LIFECYCLE_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "state=unset" >> "$GITHUB_OUTPUT"
          elif GH_TOKEN="$PAT" gh api "repos/${{ github.repository }}" --jq '.full_name' >/dev/null 2>&1; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
          else
            echo "state=degraded" >> "$GITHUB_OUTPUT"
          fi

      # Which Claude credential to probe: the first usable method in this repo's
      # CLAUDE_AUTH_ORDER (ai_auth: in bamr87/bamr87 _data/fleet.yml; unset =
      # oauth, then api_key). The step outputs a method NAME, never a secret.
      # It picks the OAuth token on presence alone (there is no free check for
      # it, which is why the one-turn probe below exists) and checks an API key
      # against the free models endpoint before picking it.
      - name: Choose the Claude credential (ai_auth order)
        id: claude-auth
        if: steps.pause.outputs.skip != 'true'
        uses: bamr87/bamr87/.github/actions/claude-auth@main
        with:
          order: ${{ vars.CLAUDE_AUTH_ORDER }}
          has-oauth: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Probe CLAUDE_CODE_OAUTH_TOKEN, or the credential CLAUDE_AUTH_ORDER puts first (1-turn Haiku, single attempt)
        id: oauth
        if: steps.pause.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.claude-auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.claude-auth.outputs.method == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: "Reply with the single word OK and nothing else."
          # --max-budget-usd: the fleet floor (10 USD); one Haiku turn costs a
          # fraction of a cent.
          claude_args: "--model claude-haiku-5-5 --max-turns 1 --max-budget-usd 10"
          show_full_output: true

      - name: Evaluate + file/close the auth issue
        if: steps.pause.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_METHOD: ${{ steps.claude-auth.outputs.method }}
          AUTH_ORDER: ${{ steps.claude-auth.outputs.order }}
        run: |
          set -uo pipefail
          # Name the credential the probe really used, so a healthy API key
          # never reads as a healthy OAuth token. `none` (or empty) means the
          # order left nothing usable: the probe then ran without a credential
          # and reads as degraded below.
          case "${AUTH_METHOD:-}" in
            oauth)   cred="CLAUDE_CODE_OAUTH_TOKEN"; fix="run \`claude setup-token\` and update the org secret (growth + the API-key fallback depend on it)" ;;
            api_key) cred="ANTHROPIC_API_KEY"; fix="issue a new key in the Anthropic console and update the org secret" ;;
            *)       cred="Claude credential"; fix="no usable credential in CLAUDE_AUTH_ORDER (${AUTH_ORDER:-oauth,api_key}): set CLAUDE_CODE_OAUTH_TOKEN (run \`claude setup-token\`) or ANTHROPIC_API_KEY as an org secret" ;;
          esac
          # Credential health from the action's result element (is_error true = auth failed).
          claude="ok"
          out=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$out" ]; then
            claude="degraded"   # action produced nothing — treat as failure
          elif jq -e '[.[] | select(.type=="result")] | last | .is_error == true' "$out" >/dev/null 2>&1; then
            claude="degraded"
          fi
          pat="${{ steps.pat.outputs.state }}"
          echo "LIFECYCLE_PAT: $pat | $cred: $claude"

          bad=""
          [ "$pat" != "ok" ] && bad="${bad}- **LIFECYCLE_PAT**: ${pat} — regenerate a PAT with repo + actions:write and update the org secret."$'\n'
          [ "$claude" != "ok" ] && bad="${bad}- **${cred}**: ${claude} — ${fix}."$'\n'

          title="Secret Expiry Watch — credential degraded"
          num="$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number' 2>/dev/null)"
          if [ -n "$bad" ]; then
            printf '## 🔐 Secret Expiry Watch — credential degraded\n_%s_\n\n%s\nFlagged BEFORE the 05:30 growth window so it does not burn on a dead credential.\n' \
              "$(date -u '+%Y-%m-%d %H:%M UTC')" "$bad" > /tmp/auth.md
            if [ -n "$num" ]; then gh issue edit "$num" --body-file /tmp/auth.md; else
              gh issue create --title "$title" --body-file /tmp/auth.md --label monitoring 2>/dev/null || gh issue create --title "$title" --body-file /tmp/auth.md
            fi
            echo "::warning::Auth degraded — see issue."
          else
            echo "✅ All credentials healthy."
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "✅ Credentials healthy again as of $(date -u '+%Y-%m-%d %H:%M UTC') — auto-closed by secret-expiry-watch." 2>/dev/null || true
            fi
          fi
